aid: codesphere
name: Codesphere
description: >-
  Codesphere is a European-built sovereign cloud platform that lets organizations
  deploy and operate applications across on-premises, hybrid, and public-cloud
  infrastructure from a single control layer, without Kubernetes expertise or
  vendor lock-in. Its Public API manages workspaces, CI/deploy pipelines,
  landscapes, managed services (PostgreSQL, Valkey, OpenSearch, RabbitMQ,
  DocumentDB, object storage, virtual Kubernetes clusters), custom domains,
  teams, organizations, secret vaults, SSH keys, and usage. A first-party `cs`
  CLI, a Go managed-services SDK, a GitHub deploy Action, and a VS Code
  extension wrap the same REST contract. Codesphere is ISO 27001 certified and
  SOC 1 & 2 attested. Surfaced as a portfolio company of Creandum and enriched
  from its own public developer surface.
