overlay: 1.0.0
info:
  title: API Evangelist enhancements for Codesphere Public API
  version: 1.0.0
extends: openapi/codesphere-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-rating: 4
    x-api-base-url: https://cloud.codesphere.com/api
    x-interactive-docs:
    - https://cloud.codesphere.com/api/swagger-ui
    - https://cloud.codesphere.com/api/scalar-ui
    x-source-spec: https://cloud.codesphere.com/api/swagger-ui/swagger-ui-init.js
- target: $.servers
  update:
  - url: https://cloud.codesphere.com/api
    description: Codesphere Public API (production)
- target: $.info
  update:
    x-authentication: authentication/codesphere-authentication.yml
    x-conventions: conventions/codesphere-conventions.yml
    x-error-catalog: errors/codesphere-problem-types.yml
    x-cli: https://github.com/codesphere-cloud/cs-go
